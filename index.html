<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="apple-touch-icon" href="icon.ico">
    <link rel="icon" href="icon.ico" type="image/x-icon">

    <title>IPTV Player Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ESTILOS GERAIS - TEMA DARK */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }

        /* TELA DE LOGIN */
        #login-section { display: flex; justify-content: center; align-items: center; width: 100%; height: 100vh; padding: 20px; }
        .login-container { background-color: #1a1a1a; padding: 40px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); width: 100%; max-width: 420px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        .login-logo { width: 120px; margin-bottom: 20px; border-radius: 10px; object-fit: contain; }
        .login-container h2 { text-align: center; margin-bottom: 24px; color: #ffffff; font-weight: 600; width: 100%; }
        .input-group { margin-bottom: 16px; width: 100%; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaaaaa; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 6px; background-color: #222; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #ffffff; background-color: #2a2a2a; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: #aaaaaa; cursor: pointer; width: 100%; }
        .btn-primary { width: 100%; padding: 14px; background-color: #ffffff; color: #0d0d0d; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-primary:hover { background-color: #e0e0e0; transform: translateY(-2px); }
        .btn-primary:disabled { background-color: #555; color: #222; cursor: not-allowed; }
        #mensagem { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; font-weight: 500; width: 100%; }
        .sucesso { color: #4caf50; } .erro { color: #ff5252; } .carregando { color: #ffffff; }

        /* DASHBOARD */
        #dashboard-section { display: none; width: 100%; height: 100vh; flex-direction: column; }
        header { background-color: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 15px; z-index: 10; }
        .header-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 10px; object-fit: contain; }
        header h1 { color: #ffffff; font-size: 22px; margin: 0; display: flex; align-items: center; gap: 5px; }
        .profile-badge { background-color: transparent; border: 1px solid #555; color: #ccc; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: normal; margin-left: 10px; }
        
        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { background-color: #222; color: #ddd; border: 1px solid #444; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background-color: #ffffff; color: #0d0d0d; border-color: #ffffff; }
        
        .btn-refresh { background-color: transparent; color: #00bcd4; border: 1px solid #00bcd4; }
        .btn-refresh:hover { background-color: #00bcd4; color: #0d0d0d; }
        .btn-fav-nav { border-color: #ffd700; color: #ffd700; }
        .btn-fav-nav:hover, .btn-fav-nav.active { background-color: #ffd700; color: #0d0d0d; }
        .btn-pwd-nav { background-color: transparent; color: #ff9800; border: 1px solid #ff9800; }
        .btn-pwd-nav:hover { background-color: #ff9800; color: #0d0d0d; }
        .btn-sair { background-color: transparent; color: #ff5252; border: 1px solid #ff5252; }
        .btn-sair:hover { background-color: #ff5252; color: white; border-color: #ff5252; }

        .search-container { display: flex; align-items: center; background-color: #222; border-radius: 20px; padding: 5px 15px; border: 1px solid #444; flex-grow: 1; max-width: 350px; transition: 0.3s; }
        .search-container:focus-within { border-color: #ffffff; }
        .search-container span { font-size: 18px; margin-right: 8px; color: #888; }
        .search-container input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }

        main { flex: 1; padding: 20px; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        .header-sessao { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .section-title { font-size: 22px; flex-grow: 1; font-weight: 600; }
        .btn-voltar { background-color: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; display: none; margin-right: 15px; font-weight: bold; transition: 0.2s; }
        .btn-voltar:hover { background-color: #ffffff; color: #0d0d0d; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        
        .card-item { background-color: #1a1a1a; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; border: 1px solid #333; display: flex; flex-direction: column; }
        .card-item:hover { transform: translateY(-5px); border-color: #ffffff; }
        .card-img { width: 100%; height: 200px; background-color: #111; object-fit: contain; padding: 0; }
        .card-title { padding: 12px 10px; font-size: 14px; font-weight: bold; flex-grow: 1; display: flex; align-items: center; justify-content: center; color: #eee; text-transform: uppercase; }

        /* --- PLAYER MODAL --- */
        #video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .video-header { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 1001; }
        .video-title { font-size: 18px; font-weight: bold; color: #ffffff; text-shadow: 1px 1px 3px #000; }
        .controles-topo { display: flex; gap: 10px; }
        .btn-fechar-video { background-color: #ff5252; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .video-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: black; }
        video { width: 100%; height: 100%; outline: none; }
        
        /* MODAIS */
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #444; width: 90%; max-width: 350px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="login-container">
            <img src="icon.ico" alt="Logo" class="login-logo">
            <h2>Entrar com Xtream</h2>
            <form id="loginForm" style="width: 100%;">
                <div class="input-group"><label>Nome do Perfil</label><input type="text" id="profileName" required placeholder="Ex: Casa"></div>
                <div class="input-group"><label>URL do Servidor</label><input type="url" id="serverUrl" required placeholder="http://..."></div>
                <div class="input-group"><label>Usuário</label><input type="text" id="username" required></div>
                <div class="input-group"><label>Senha</label><input type="password" id="password" required></div>
                <label class="checkbox-group"><input type="checkbox" id="lembrarSenha"> Lembrar meus dados</label>
                <button type="submit" class="btn-primary" id="btnEntrar">Conectar</button>
            </form>
            <div id="mensagem"></div>
        </div>
    </div>

    <div id="dashboard-section">
        <header>
            <h1>
                <img src="icon.ico" alt="Logo" class="header-logo">
                Meu App IPTV <span id="display-profile" class="profile-badge" style="display: none;"></span>
            </h1>
            <div class="search-container">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Pesquisar nesta pasta..." onkeyup="dispararPesquisa()">
            </div>
            <nav>
                <button class="nav-btn active" onclick="carregarCategorias('get_live_categories', 'TV Ao Vivo', this, 'live')">TV Ao Vivo</button>
                <button class="nav-btn" onclick="carregarCategorias('get_vod_categories', 'Filmes', this, 'vod')">Filmes</button>
                <button class="nav-btn" onclick="carregarCategorias('get_series_categories', 'Séries', this, 'series')">Séries</button>
                <button class="nav-btn btn-sair" onclick="fazerLogout()">Sair 🚪</button>
            </nav>
        </header>
        
        <main>
            <div id="view-grid">
                <div class="header-sessao">
                    <button class="btn-voltar" id="btn-voltar" onclick="voltarParaCategorias()">⬅ Voltar</button>
                    <h2 class="section-title" id="titulo-sessao">Categorias</h2>
                </div>
                <div class="grid-container" id="grid-conteudo"></div>
            </div>
        </main>
    </div>

    <div id="video-modal">
        <div class="video-header">
            <div class="video-title" id="video-title">Vídeo</div>
            <div class="controles-topo">
                <button class="btn-fechar-video" onclick="fecharPlayer()">Fechar ❌</button>
            </div>
        </div>
        <div class="video-wrapper">
            <video id="player" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        // --- VARIÁVEIS GLOBAIS ---
        let credenciais = { url: '', user: '', pass: '' };
        let tipoAtual = 'live'; let hlsInfo = null;

        window.onload = () => {
            const dadosSalvos = localStorage.getItem('iptv_dados');
            if (dadosSalvos) {
                const d = JSON.parse(dadosSalvos);
                document.getElementById('profileName').value = d.profile || '';
                document.getElementById('serverUrl').value = d.url || '';
                document.getElementById('username').value = d.user || '';
                document.getElementById('password').value = d.pass || '';
                document.getElementById('lembrarSenha').checked = true;
            }
        };

        // --- NOVA LÓGICA DE PESQUISA (FILTRO INSTANTÂNEO) ---
        function dispararPesquisa() {
            const termo = document.getElementById('searchInput').value.trim().toLowerCase();
            const cards = document.querySelectorAll('.card-item');
            
            cards.forEach(card => {
                const titulo = card.innerText.toLowerCase();
                if (titulo.includes(termo)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- SISTEMA DE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('mensagem');
            const btn = document.getElementById('btnEntrar');
            
            credenciais.url = document.getElementById('serverUrl').value.trim().replace(/\/+$/, "");
            credenciais.user = document.getElementById('username').value.trim();
            credenciais.pass = document.getElementById('password').value.trim();

            btn.disabled = true; msg.innerText = 'Conectando...';

            try {
                const res = await fetch(`${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}`);
                const data = await res.json();
                
                if (data.user_info && data.user_info.auth === 1) {
                    if (document.getElementById('lembrarSenha').checked) {
                        localStorage.setItem('iptv_dados', JSON.stringify({...credenciais, profile: document.getElementById('profileName').value}));
                    }
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'flex';
                    carregarCategorias('get_live_categories', 'TV Ao Vivo', document.querySelector('.nav-btn.active'), 'live');
                } else { throw new Error("Acesso negado."); }
            } catch (err) { msg.innerText = "Erro: Verifique a URL/CORS."; } finally { btn.disabled = false; }
        });

        // --- CARREGAMENTO DE CONTEÚDO ---
        async function carregarCategorias(acao, titulo, btn, tipo) {
            tipoAtual = tipo;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('titulo-sessao').innerText = titulo;
            const grid = document.getElementById('grid-conteudo');
            grid.innerHTML = 'Carregando pastas...';

            try {
                const res = await fetch(`${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${acao}`);
                const cats = await res.json();
                grid.innerHTML = '';
                cats.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'card-item';
                    card.innerHTML = `<div style="height:160px; font-size:50px; display:flex; align-items:center; justify-content:center; background:#222;">📁</div><div class="card-title">${c.category_name}</div>`;
                    card.onclick = () => carregarConteudo(c.category_id, c.category_name);
                    grid.appendChild(card);
                });
            } catch (e) { grid.innerHTML = 'Erro ao carregar.'; }
        }

        async function carregarConteudo(id, nome) {
            document.getElementById('btn-voltar').style.display = 'block';
            document.getElementById('titulo-sessao').innerText = nome;
            const grid = document.getElementById('grid-conteudo');
            grid.innerHTML = 'Buscando itens...';
            let acao = tipoAtual === 'live' ? `get_live_streams&category_id=${id}` : `get_vod_streams&category_id=${id}`;
            
            try {
                const res = await fetch(`${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${acao}`);
                const itens = await res.json();
                grid.innerHTML = '';
                itens.forEach(i => {
                    const card = document.createElement('div');
                    card.className = 'card-item';
                    const img = i.stream_icon || i.cover || 'https://ui-avatars.com/api/?name=IPTV';
                    card.innerHTML = `<img src="${img}" class="card-img"><div class="card-title">${i.name}</div>`;
                    card.onclick = () => iniciarVideo(i);
                    grid.appendChild(card);
                });
            } catch (e) { grid.innerHTML = 'Erro ao carregar pasta.'; }
        }

        // --- PLAYER ---
        function iniciarVideo(item) {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('player');
            const id = item.stream_id;
            let url = '';

            if (tipoAtual === 'live') {
                url = `${credenciais.url}/live/${credenciais.user}/${credenciais.pass}/${id}.m3u8`;
            } else {
                url = `${credenciais.url}/movie/${credenciais.user}/${credenciais.pass}/${id}.${item.container_extension || 'mp4'}`;
            }

            modal.style.display = 'flex';
            document.getElementById('video-title').innerText = item.name;

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (hlsInfo) hlsInfo.destroy();
                hlsInfo = new Hls(); hlsInfo.loadSource(url); hlsInfo.attachMedia(player);
                hlsInfo.on(Hls.Events.MANIFEST_PARSED, () => player.play());
            } else {
                player.src = url;
                player.play();
            }
        }

        function fecharPlayer() {
            document.getElementById('video-modal').style.display = 'none';
            const p = document.getElementById('player'); p.pause(); p.src = '';
            if (hlsInfo) hlsInfo.destroy();
        }

        function voltarParaCategorias() { document.querySelector('.nav-btn.active').click(); }
        function fazerLogout() { location.reload(); }
    </script>
</body>
</html>
