<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="apple-touch-icon" href="icon.ico">
    <link rel="icon" href="icon.ico" type="image/x-icon">

    <title>IPTV Player Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ESTILOS GERAIS */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }

        /* TELA DE LOGIN */
        #login-section { display: flex; justify-content: center; align-items: center; width: 100%; height: 100vh; padding: 20px; }
        .login-container { background-color: #1a1a1a; padding: 40px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); width: 100%; max-width: 420px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        .login-logo { width: 120px; margin-bottom: 20px; border-radius: 10px; object-fit: contain; }
        .login-container h2 { text-align: center; margin-bottom: 24px; color: #ffffff; font-weight: 600; width: 100%; }
        .input-group { margin-bottom: 16px; width: 100%; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaaaaa; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 6px; background-color: #222; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #ffffff; background-color: #2a2a2a; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: #aaaaaa; cursor: pointer; width: 100%; }
        .btn-primary { width: 100%; padding: 14px; background-color: #ffffff; color: #0d0d0d; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-primary:hover { background-color: #e0e0e0; transform: translateY(-2px); }
        .btn-primary:disabled { background-color: #555; color: #222; cursor: not-allowed; }
        #mensagem { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; font-weight: 500; width: 100%; }
        .sucesso { color: #4caf50; } .erro { color: #ff5252; } .carregando { color: #ffffff; }

        /* DASHBOARD */
        #dashboard-section { display: none; width: 100%; height: 100vh; flex-direction: column; }
        header { background-color: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 15px; z-index: 10; }
        .header-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 10px; object-fit: contain; }
        header h1 { color: #ffffff; font-size: 22px; margin: 0; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        
        .profile-badge { background-color: transparent; border: 1px solid #555; color: #ccc; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: normal; margin-left: 10px; }
        .expire-badge { background-color: transparent; border: 1px solid #4caf50; color: #4caf50; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-left: 10px; display: flex; align-items: center; gap: 5px; white-space: nowrap;}
        .expire-badge.warning { border-color: #ff9800; color: #ff9800; }
        .expire-badge.danger { border-color: #ff5252; color: #ff5252; }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { background-color: #222; color: #ddd; border: 1px solid #444; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background-color: #ffffff; color: #0d0d0d; border-color: #ffffff; }
        .btn-pwd-nav { background-color: transparent; color: #ff9800; border: 1px solid #ff9800; }
        .btn-pwd-nav:hover { background-color: #ff9800; color: #0d0d0d; }
        .btn-fav-nav { border-color: #ffd700; color: #ffd700; }
        .btn-fav-nav:hover, .btn-fav-nav.active { background-color: #ffd700; color: #0d0d0d; }
        .btn-sair { background-color: transparent; color: #ff5252; border: 1px solid #ff5252; }
        .btn-sair:hover { background-color: #ff5252; color: white; border-color: #ff5252; }

        .search-container { display: flex; align-items: center; background-color: #222; border-radius: 20px; padding: 5px 15px; border: 1px solid #444; flex-grow: 1; max-width: 350px; transition: 0.3s; }
        .search-container input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; margin-left: 8px;}

        main { flex: 1; padding: 20px; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        .header-sessao { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .section-title { font-size: 22px; flex-grow: 1; font-weight: 600; }
        .btn-voltar { background-color: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; display: none; margin-right: 15px; font-weight: bold; transition: 0.2s; }
        .btn-voltar:hover { background-color: #ffffff; color: #0d0d0d; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        
        .card-item { background-color: #1a1a1a; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; border: 1px solid #333; display: flex; flex-direction: column; }
        .card-item:hover { transform: translateY(-5px); border-color: #ffffff; }
        .card-img { width: 100%; height: 200px; background-color: #111; object-fit: contain; padding: 5px; }
        .card-title { padding: 12px 10px; font-size: 14px; font-weight: bold; flex-grow: 1; display: flex; align-items: center; justify-content: center; color: #eee; text-transform: uppercase; }

        /* TELA DE DETALHES */
        #details-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #0d0d0d; z-index: 5; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .details-hero { position: relative; width: 100%; min-height: 400px; display: flex; padding: 40px; gap: 30px; align-items: flex-end; background-size: cover; background-position: center; flex-wrap: wrap; }
        .details-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, #0d0d0d 10%, rgba(13,13,13,0.8) 50%, rgba(13,13,13,0.5) 100%); }
        .details-poster { width: 180px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 2; background: #111; object-fit: contain; padding: 5px;}
        .details-info { z-index: 2; max-width: 800px; flex: 1; min-width: 280px;}
        .details-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
        .details-plot { font-size: 15px; line-height: 1.5; color: #ddd; margin-bottom: 25px; text-shadow: 1px 1px 3px #000; }
        
        .details-actions { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-play-big { padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 6px; border: none; background: #ffffff; color: #000; cursor: pointer; transition: 0.2s; }
        .btn-play-big:hover { background: #e0e0e0; transform: scale(1.05); }
        .btn-fav-big { padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; border: 1px solid #fff; background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; transition: 0.2s; }
        .btn-fav-big:hover { background: #fff; color: #000; }
        .btn-fav-big.is-fav { border-color: #ffd700; color: #ffd700; }

        .btn-close-details { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
        .btn-close-details:hover { background: rgba(0,0,0,0.8); color: #ff5252; }
        .details-extra-content { padding: 20px; z-index: 2; position: relative; }

        /* PLAYER NATIVO SIMPLIFICADO */
        #video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 1000; flex-direction: column; }
        .video-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-bottom: 1px solid #333; }
        .video-title { font-size: 18px; font-weight: bold; color: #ffffff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 15px; }
        .btn-fechar-video { background-color: #ff5252; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-fechar-video:hover { background-color: #ff0000; }
        
        .video-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; width: 100%; }
        video { width: 100%; height: 100%; outline: none; max-height: calc(100vh - 140px); background: #000; }
        
        #video-error { display: none; position: absolute; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 8px; color: #ff5252; text-align: center; border: 1px solid #ff5252; z-index: 1001; }
        .btn-forcar { background: #00bcd4; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 6px; margin-top: 15px; cursor: pointer; }

        .custom-bottom-bar { background: #111; padding: 15px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid #333; flex-wrap: wrap; }
        .action-btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .action-btn:hover { background: #fff; color: #000; }

        /* MODAIS */
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #444; width: 100%; max-width: 350px; text-align: center; }
        .modal-content h3 { margin-bottom: 10px; color: #fff; }
        .modal-content p { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        .modal-content input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; outline: none; font-size: 16px; text-align: center; margin-bottom: 5px; }
        .modal-content input:focus { border-color: #fff; }
        .btn-acao { background-color: rgba(51, 51, 51, 0.8); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-acao:hover { background-color: #ffffff; color: #000; }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="login-container">
            <img src="icon.ico" alt="Logo" class="login-logo" onerror="this.style.display='none'">
            <h2>Entrar com Xtream</h2>
            <form id="loginForm" style="width: 100%;">
                <div class="input-group"><label>Nome do Perfil</label><input type="text" id="profileName" required placeholder="Ex: Casa"></div>
                <div class="input-group"><label>URL do Servidor</label><input type="url" id="serverUrl" required placeholder="Ex: http://oriontv.sbs"></div>
                <div class="input-group"><label>Usuário</label><input type="text" id="username" required></div>
                <div class="input-group"><label>Senha</label><input type="password" id="password" required></div>
                <label class="checkbox-group"><input type="checkbox" id="lembrarSenha"> Lembrar meus dados</label>
                <button type="submit" class="btn-primary" id="btnEntrar">Conectar</button>
            </form>
            <div id="mensagem"></div>
        </div>
    </div>

    <div id="dashboard-section">
        <header>
            <h1>
                <img src="icon.ico" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                Meu App IPTV 
            </h1>
            <div class="search-container">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Pesquisar..." onkeyup="dispararPesquisa()">
            </div>
            <nav>
                <button class="nav-btn active" onclick="carregarCategorias('get_live_categories', 'TV Ao Vivo', this, 'live')">TV Ao Vivo</button>
                <button class="nav-btn" onclick="carregarCategorias('get_vod_categories', 'Filmes', this, 'vod')">Filmes</button>
                <button class="nav-btn" onclick="carregarCategorias('get_series_categories', 'Séries', this, 'series')">Séries</button>
                <button class="nav-btn btn-fav-nav" onclick="abrirTelaFavoritos(this)">⭐ Favoritos</button>
                <button class="nav-btn btn-pwd-nav" onclick="abrirModalTrocarSenha()">🔒 Senha +18</button>
                <button class="nav-btn btn-sair" onclick="fazerLogout()">Sair 🚪</button>
            </nav>
            <div style="width: 100%; display: flex; justify-content: flex-end; margin-top: 5px;">
                <span id="display-profile" class="profile-badge" style="display: none;"></span>
                <span id="display-expire" class="expire-badge" style="display: none;"></span>
            </div>
        </header>
        
        <main>
            <div id="view-grid">
                <div class="header-sessao">
                    <button class="btn-voltar" id="btn-voltar" onclick="voltarParaCategorias()">⬅ Voltar</button>
                    <h2 class="section-title" id="titulo-sessao">Carregando...</h2>
                </div>
                <div class="grid-container" id="grid-conteudo"></div>
            </div>

            <div id="details-screen">
                <button class="btn-close-details" onclick="fecharDetalhes()">X</button>
                <div class="details-hero" id="details-hero">
                    <div class="details-overlay"></div>
                    <img id="details-poster" class="details-poster" src="" onerror="this.src='icon.ico'">
                    <div class="details-info">
                        <h1 id="details-title">Título</h1>
                        <p class="details-plot" id="details-plot">Sinopse indisponível.</p>
                        <div class="details-actions">
                            <button class="btn-play-big" id="btn-details-play">▶ Assistir</button>
                            <button class="btn-fav-big" id="btn-details-fav" onclick="alternarFavoritoDetalhes()">☆ Add Favorito</button>
                        </div>
                    </div>
                </div>
                <div class="details-extra-content">
                    <button class="btn-voltar" id="btn-voltar-temporadas" style="margin-bottom: 20px; display: none;" onclick="voltarParaTemporadas()">⬅ Voltar Temporadas</button>
                    <div class="grid-container" id="details-extra-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="video-modal">
        <div class="video-header">
            <div class="video-title" id="video-title">Vídeo</div>
            <button class="btn-fechar-video" onclick="fecharPlayer()">✕ Fechar Player</button>
        </div>
        <div class="video-container">
            <div id="video-error">
                <strong>O Navegador bloqueou o vídeo. 🔒</strong><br>
                <button class="btn-forcar" onclick="forcarAbaExterna()">Forçar Vídeo (Nova Aba)</button>
            </div>
            <video id="player" controls autoplay playsinline></video>
        </div>
        <div class="custom-bottom-bar">
            <button class="action-btn" onclick="player.currentTime -= 10">⏪ Voltar 10s</button>
            <button class="action-btn" onclick="player.currentTime += 10">⏩ Avançar 10s</button>
            <button class="action-btn" id="btn-download" onclick="baixarVideo()">📥 Baixar Vídeo</button>
        </div>
    </div>

    <div id="resume-modal" class="custom-modal">
        <div class="modal-content">
            <h3>Continuar Assistindo?</h3>
            <div style="display:flex; justify-content: center; gap:10px; margin-top:15px;">
                <button class="btn-acao" onclick="iniciarVideoHLS(0)">Do Início</button>
                <button class="btn-play-big" style="padding: 8px 25px; font-size: 14px;" id="btn-resume-continue">Continuar</button>
            </div>
        </div>
    </div>

    <div id="adult-modal" class="custom-modal">
        <div class="modal-content">
            <h3>Conteúdo +18 🔞</h3>
            <input type="password" id="adult-pwd-input" placeholder="Digite a senha...">
            <div id="adult-error" style="color:#ff5252; font-size:12px; margin-top:5px; display:none;">Senha incorreta!</div>
            <div style="display:flex; justify-content: center; gap:10px; margin-top:15px;">
                <button class="btn-acao" onclick="fecharModalAdulto()">Cancelar</button>
                <button class="btn-play-big" style="padding: 8px 25px; font-size: 14px;" onclick="verificarSenhaAdulto()">Entrar</button>
            </div>
        </div>
    </div>

    <div id="change-pwd-modal" class="custom-modal">
        <div class="modal-content">
            <h3>Trocar Senha +18</h3>
            <input type="password" id="old-pwd-input" placeholder="Senha Atual">
            <input type="password" id="new-pwd-input" placeholder="Nova Senha" style="margin-top:10px;">
            <div id="change-pwd-error" style="color:#ff5252; font-size:12px; margin-top:5px; display:none;">Erro ao trocar a senha.</div>
            <div id="change-pwd-success" style="color:#4caf50; font-size:13px; font-weight:bold; margin-top:5px; display:none;">Senha alterada com sucesso!</div>
            <div style="display:flex; justify-content: center; gap:10px; margin-top:15px;">
                <button class="btn-acao" onclick="fecharModalTrocarSenha()">Cancelar</button>
                <button class="btn-play-big" style="padding: 8px 25px; font-size: 14px;" onclick="salvarNovaSenha()">Salvar Nova</button>
            </div>
        </div>
    </div>

    <script>
        // --- VARIÁVEIS GLOBAIS ---
        let credenciais = { profile: '', url: '', user: '', pass: '' };
        let tipoAtual = 'live'; let modoAtual = 'categorias';
        let hlsInfo = null; let urlVideoAtual = ''; let nomeVideoAtual = ''; let videoIdAtual = '';
        let infoVideoAtual = null; let serieDadosCompletos = null; 
        let meusFavoritos = { live: [], vod: [], series: [] };
        const imgFallback = 'icon.ico';

        // --- FETCH COM PROXY FALLBACK MANTIDO PARA GARANTIR O LOGIN ---
        async function fetchApi(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                return await response.json();
            } catch (error) {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const proxyResponse = await fetch(proxyUrl);
                return await proxyResponse.json();
            }
        }

        window.onload = () => {
            const dadosSalvos = localStorage.getItem('iptv_dados');
            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                document.getElementById('profileName').value = dados.profile || '';
                document.getElementById('serverUrl').value = dados.url || '';
                document.getElementById('username').value = dados.user || '';
                document.getElementById('password').value = dados.pass || '';
                document.getElementById('lembrarSenha').checked = true;
                setTimeout(() => { document.getElementById('loginForm').dispatchEvent(new Event('submit')); }, 500);
            }
            if (localStorage.getItem('iptv_favoritos')) meusFavoritos = JSON.parse(localStorage.getItem('iptv_favoritos'));
        };
        
        function salvarFavoritos() { localStorage.setItem('iptv_favoritos', JSON.stringify(meusFavoritos)); }

        // --- SISTEMA CONTROLE PARENTAL ---
        function getSenhaAdulto() { return localStorage.getItem('iptv_adult_pwd') || '5274'; }
        let callbackSenhaAdulto = null;
        function isAdultContent(name) {
            if (!name) return false;
            let n = name.toLowerCase();
            return n.includes('adulto') || n.includes('18') || n.includes('xxx') || n.includes('porn');
        }
        function interceptarCarregarConteudo(categoryId, categoryName) {
            if (isAdultContent(categoryName)) { abrirModalAdulto(() => carregarConteudoDaCategoria(categoryId, categoryName)); } else { carregarConteudoDaCategoria(categoryId, categoryName); }
        }
        function interceptarAbrirDetalhes(item, nomeItem) {
            if (isAdultContent(nomeItem) || isAdultContent(item.category_name)) { abrirModalAdulto(() => abrirDetalhes(item, nomeItem)); } else { abrirDetalhes(item, nomeItem); }
        }
        function abrirModalAdulto(callback) {
            callbackSenhaAdulto = callback;
            const input = document.getElementById('adult-pwd-input');
            input.value = ''; input.placeholder = getSenhaAdulto() === '5274' ? "Senha padrão: 5274" : "Digite sua senha...";
            document.getElementById('adult-error').style.display = 'none';
            document.getElementById('adult-modal').style.display = 'flex';
            input.focus();
        }
        function fecharModalAdulto() { document.getElementById('adult-modal').style.display = 'none'; }
        function verificarSenhaAdulto() {
            if (document.getElementById('adult-pwd-input').value === getSenhaAdulto()) { let acaoSalva = callbackSenhaAdulto; fecharModalAdulto(); if (acaoSalva) acaoSalva(); } 
            else { document.getElementById('adult-error').style.display = 'block'; }
        }
        document.getElementById('adult-pwd-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') verificarSenhaAdulto(); });
        function abrirModalTrocarSenha() { document.getElementById('change-pwd-modal').style.display = 'flex'; }
        function fecharModalTrocarSenha() { document.getElementById('change-pwd-modal').style.display = 'none'; }
        function salvarNovaSenha() {
            const oldPwd = document.getElementById('old-pwd-input').value; const newPwd = document.getElementById('new-pwd-input').value;
            if (oldPwd !== getSenhaAdulto() || newPwd.length < 4) { document.getElementById('change-pwd-error').style.display = 'block'; return; }
            localStorage.setItem('iptv_adult_pwd', newPwd); document.getElementById('change-pwd-success').style.display = 'block';
            setTimeout(() => { fecharModalTrocarSenha(); }, 1500);
        }

        // --- LOGIN COM PROXY DE VOLTA ---
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const btnEntrar = document.getElementById('btnEntrar');
            const mensagem = document.getElementById('mensagem');
            const lembrar = document.getElementById('lembrarSenha').checked;
            
            credenciais.profile = document.getElementById('profileName').value.trim();
            let urlLimpa = document.getElementById('serverUrl').value.trim().replace(/\/+$/, "");
            if (urlLimpa !== "" && !urlLimpa.startsWith('http')) urlLimpa = 'http://' + urlLimpa;
            
            credenciais.url = urlLimpa;
            credenciais.user = document.getElementById('username').value.trim();
            credenciais.pass = document.getElementById('password').value.trim();

            btnEntrar.disabled = true; mensagem.className = 'carregando'; 
            mensagem.innerText = 'Autenticando...';

            try {
                const url = `${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}`;
                // USANDO A FUNÇÃO COM PROXY PARA EVITAR O BLOQUEIO NA TELA VERMELHA
                const data = await fetchApi(url);
                
                if (data.user_info && data.user_info.auth === 1) {
                    if (lembrar) localStorage.setItem('iptv_dados', JSON.stringify(credenciais));
                    else localStorage.removeItem('iptv_dados');

                    if (data.user_info.exp_date && data.user_info.exp_date !== "null") {
                        const timestamp = parseInt(data.user_info.exp_date);
                        if (!isNaN(timestamp)) {
                            const dataExp = new Date(timestamp * 1000);
                            const hoje = new Date();
                            const diasRestantes = Math.ceil((dataExp - hoje) / (1000 * 60 * 60 * 24));
                            const dia = String(dataExp.getDate()).padStart(2, '0');
                            const mes = String(dataExp.getMonth() + 1).padStart(2, '0');
                            const ano = dataExp.getFullYear();
                            
                            const badgeExp = document.getElementById('display-expire');
                            badgeExp.innerHTML = `🔋 Expira: ${dia}/${mes}/${ano}`;
                            if (diasRestantes <= 7) { badgeExp.className = 'expire-badge danger'; } 
                            else if (diasRestantes <= 15) { badgeExp.className = 'expire-badge warning'; } 
                            else { badgeExp.className = 'expire-badge'; }
                            badgeExp.style.display = 'inline-flex';
                        }
                    }

                    document.getElementById('display-profile').innerText = credenciais.profile; 
                    document.getElementById('display-profile').style.display = 'inline-block';
                    document.getElementById('login-section').style.display = 'none'; 
                    document.getElementById('dashboard-section').style.display = 'flex';
                    
                    if(document.getElementById('grid-conteudo').innerHTML === '') {
                        carregarCategorias('get_live_categories', 'TV Ao Vivo', document.querySelector('.nav-btn.active'), 'live');
                    }
                } else { throw new Error("Usuário ou Senha incorretos."); }
            } catch (e) {
                mensagem.className = 'erro'; 
                mensagem.innerText = "Erro ao conectar. Verifique os dados ou a rede.";
            } finally { btnEntrar.disabled = false; }
        });

        function fazerLogout() { 
            fecharPlayer(); fecharDetalhes(); 
            localStorage.removeItem('iptv_dados');
            document.getElementById('lembrarSenha').checked = false;
            document.getElementById('dashboard-section').style.display = 'none'; 
            document.getElementById('login-section').style.display = 'flex'; 
        }

        function getSafeImage(imgUrl) {
            if (!imgUrl || imgUrl.trim() === '' || imgUrl.includes('ui-avatars.com')) return imgFallback;
            return imgUrl;
        }

        // --- CARREGAMENTO API ---
        async function carregarCategorias(acaoApi, tituloTela, botaoClicado, tipo) {
            fecharDetalhes(); document.querySelectorAll('.nav-btn:not(.btn-sair)').forEach(btn => btn.classList.remove('active')); if(botaoClicado) botaoClicado.classList.add('active');
            tipoAtual = tipo; modoAtual = 'categorias'; document.getElementById('btn-voltar').style.display = 'none'; document.getElementById('titulo-sessao').innerText = `Categorias - ${tituloTela}`;
            document.getElementById('searchInput').value = '';
            const grid = document.getElementById('grid-conteudo'); grid.innerHTML = '<div style="color:#fff; text-align:center; width:100%;">Carregando pastas...</div>';

            try {
                const url = `${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${acaoApi}`;
                const categorias = await fetchApi(url); 
                grid.innerHTML = '';
                
                categorias.forEach(cat => {
                    const card = document.createElement('div'); card.className = 'card-item';
                    let imgUrl = getSafeImage(cat.category_icon);
                    card.innerHTML = `<img src="${imgUrl}" class="card-img" onerror="this.onerror=null; this.src='${imgFallback}';"><div class="card-title">${cat.category_name}</div>`;
                    card.onclick = () => carregarConteudoDaCategoria(cat.category_id, cat.category_name);
                    grid.appendChild(card);
                });
            } catch (e) { grid.innerHTML = '<div style="color:red; text-align:center;">Erro ao carregar as pastas.</div>'; }
        }

        async function carregarConteudoDaCategoria(categoryId, categoryName) {
            modoAtual = 'streams'; document.getElementById('btn-voltar').style.display = 'block'; document.getElementById('titulo-sessao').innerText = `Pasta: ${categoryName}`;
            document.getElementById('searchInput').value = '';
            const grid = document.getElementById('grid-conteudo'); grid.innerHTML = '<div style="color:#fff; text-align:center; width:100%;">Carregando...</div>';
            let acaoApi = tipoAtual === 'live' ? `get_live_streams&category_id=${categoryId}` : tipoAtual === 'vod' ? `get_vod_streams&category_id=${categoryId}` : `get_series&category_id=${categoryId}`;
            
            try {
                const url = `${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${acaoApi}`;
                const itens = await fetchApi(url);
                grid.innerHTML = '';
                if (itens.length === 0) { grid.innerHTML = '<div style="color:#fff;">Nenhum conteúdo.</div>'; return; }
                
                itens.forEach(item => {
                    const card = document.createElement('div'); card.className = 'card-item';
                    const nomeItem = item.name || item.title;
                    const imgUrl = getSafeImage(item.stream_icon || item.cover);
                    card.innerHTML = `<img src="${imgUrl}" class="card-img" onerror="this.onerror=null; this.src='${imgFallback}';"><div class="card-title">${nomeItem}</div>`;
                    card.onclick = () => abrirDetalhes(item, nomeItem);
                    grid.appendChild(card);
                });
            } catch (e) { grid.innerHTML = '<div style="color:red;">Erro ao carregar os itens.</div>'; }
        }

        // --- DETALHES E PESQUISA ---
        function fecharDetalhes() { document.getElementById('details-screen').style.display = 'none'; }
        
        async function abrirDetalhes(item, nome) {
            document.getElementById('details-screen').style.display = 'flex'; 
            const id = item.stream_id || item.series_id || item.id_real || item.id;
            const ext = item.container_extension || item.extensao || 'mp4';
            let capa = getSafeImage(item.stream_icon || item.cover || item.capa);
            
            infoVideoAtual = { id, nome, tipo: tipoAtual, capa, ext };
            
            document.getElementById('details-title').innerText = nome; 
            document.getElementById('details-poster').src = capa;
            document.getElementById('details-hero').style.backgroundImage = `url('${capa}')`;
            document.getElementById('details-plot').innerText = 'Carregando informações...';
            document.getElementById('btn-voltar-temporadas').style.display = 'none';
            
            document.getElementById('btn-details-play').style.display = (tipoAtual === 'series') ? 'none' : 'block'; 
            document.getElementById('btn-details-play').onclick = () => prepararVideo(infoVideoAtual.id, ext, nome);
            atualizarBotaoFavDetalhes();
            
            if (tipoAtual === 'vod') {
                try {
                    const data = await fetchApi(`${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=get_vod_info&vod_id=${id}`);
                    document.getElementById('details-plot').innerText = data.info.plot || 'Sem sinopse disponível.';
                } catch(e) { document.getElementById('details-plot').innerText = 'Sem sinopse disponível.'; }
            } else if (tipoAtual === 'series') { renderizarTemporadasSérie(id, nome); }
            else { document.getElementById('details-plot').innerText = 'Ao Vivo'; }
        }

        async function renderizarTemporadasSérie(id, nomeSerie) {
            document.getElementById('btn-voltar-temporadas').style.display = 'none'; 
            const gridExtra = document.getElementById('details-extra-grid'); gridExtra.innerHTML = '<div style="color:white;">Carregando temporadas...</div>';
            try {
                if(!serieDadosCompletos || serieDadosCompletos.info.name !== nomeSerie) {
                    serieDadosCompletos = await fetchApi(`${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=get_series_info&series_id=${id}`);
                }
                document.getElementById('details-plot').innerText = serieDadosCompletos.info.plot || 'Sem sinopse.';
                gridExtra.innerHTML = '';
                if(serieDadosCompletos.episodes) {
                    Object.keys(serieDadosCompletos.episodes).forEach(tNum => {
                        const block = document.createElement('div'); block.className = 'card-item season-block';
                        block.innerHTML = `<div class="season-title">T${tNum}</div><div class="season-episodes">${serieDadosCompletos.episodes[tNum].length} Eps</div>`;
                        block.onclick = () => renderizarEpisodiosSérie(tNum, nomeSerie, id);
                        gridExtra.appendChild(block);
                    });
                }
            } catch(e) { gridExtra.innerHTML = 'Erro ao carregar as temporadas.'; }
        }

        function renderizarEpisodiosSérie(numTemporada, nomeSerie, idSerie) {
            document.getElementById('btn-voltar-temporadas').style.display = 'inline-block';
            const gridExtra = document.getElementById('details-extra-grid'); gridExtra.innerHTML = '';
            serieDadosCompletos.episodes[numTemporada].forEach(ep => {
                const card = document.createElement('div'); card.className = 'card-episode'; 
                const title = `E${ep.episode_num} - ${ep.title}`;
                let thumbUrl = getSafeImage(ep.info?.movie_image || ep.info?.cover || infoVideoAtual.capa);
                card.innerHTML = `<img src="${thumbUrl}" class="card-img" onerror="this.onerror=null; this.src='${imgFallback}'"><div class="card-title">${title}</div>`;
                card.onclick = () => prepararVideo(ep.id, ep.container_extension || 'mp4', `${nomeSerie} - ${title}`);
                gridExtra.appendChild(card);
            });
        }

        function voltarParaTemporadas() { renderizarTemporadasSérie(infoVideoAtual.id, infoVideoAtual.nome); }
        function voltarParaCategorias() { document.querySelector('.nav-btn.active').click(); }

        let timeoutPesquisa = null;
        function dispararPesquisa() { clearTimeout(timeoutPesquisa); timeoutPesquisa = setTimeout(realizarPesquisa, 800); }
        async function realizarPesquisa() {
            const termo = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('grid-conteudo');
            if (termo === '') { 
                if (modoAtual === 'pesquisa') document.querySelector('.nav-btn.active').click(); 
                else document.querySelectorAll('.card-item').forEach(c => c.style.display = 'flex');
                return; 
            }
            if (modoAtual === 'streams' || modoAtual === 'favoritos') { 
                document.querySelectorAll('.card-item').forEach(c => { 
                    c.style.display = c.innerText.toLowerCase().includes(termo) ? 'flex' : 'none'; 
                }); 
                return; 
            }
            fecharDetalhes(); 
            document.getElementById('titulo-sessao').innerText = `Procurando "${termo}"...`; 
            document.getElementById('btn-voltar').style.display = 'block';
            grid.innerHTML = '<div style="color:#fff; text-align:center; width:100%;">Buscando no catálogo...</div>';
            let acaoApi = tipoAtual === 'live' ? 'get_live_streams' : tipoAtual === 'vod' ? 'get_vod_streams' : 'get_series';
            try {
                const url = `${credenciais.url}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${acaoApi}`;
                const todos = await fetchApi(url);
                const resultados = todos.filter(item => (item.name || item.title || '').toLowerCase().includes(termo));
                document.getElementById('titulo-sessao').innerText = `Resultados (${resultados.length})`; 
                renderizarItens(resultados, grid); 
                modoAtual = 'pesquisa';
            } catch (e) { grid.innerHTML = '<div style="color:red;">Erro na pesquisa global.</div>'; }
        }

        function alternarFavoritoDetalhes() {
            let isFav = meusFavoritos[infoVideoAtual.tipo]?.some(i => i.id_real == infoVideoAtual.id);
            if (isFav) meusFavoritos[infoVideoAtual.tipo] = meusFavoritos[infoVideoAtual.tipo].filter(i => i.id_real != infoVideoAtual.id);
            else meusFavoritos[infoVideoAtual.tipo].push({ id_real: infoVideoAtual.id, nome: infoVideoAtual.nome, tipo: infoVideoAtual.tipo, stream_icon: infoVideoAtual.capa, extensao: infoVideoAtual.extensao });
            salvarFavoritos(); atualizarBotaoFavDetalhes();
        }
        function atualizarBotaoFavDetalhes() {
            const btn = document.getElementById('btn-details-fav');
            if(meusFavoritos[infoVideoAtual.tipo]?.some(i => i.id_real == infoVideoAtual.id)) { btn.classList.add('is-fav'); btn.innerText = '⭐ Favorito'; } else { btn.classList.remove('is-fav'); btn.innerText = '☆ Add Favorito'; }
        }
        function abrirTelaFavoritos(btnClicado) { 
            fecharDetalhes(); document.querySelectorAll('.nav-btn:not(.btn-refresh):not(.btn-pwd-nav)').forEach(b => b.classList.remove('active')); btnClicado.classList.add('active');
            modoAtual = 'favoritos'; document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('titulo-sessao').innerText = `Meus Favoritos ⭐`;
            const grid = document.getElementById('grid-conteudo'); grid.innerHTML = '';
            if(meusFavoritos.live.length > 0) { grid.innerHTML += `<div style="grid-column: 1 / -1; font-size: 18px; color: #fff; margin-top: 10px;">Canais de TV</div>`; meusFavoritos.live.forEach(i => criarCardFavorito(i, grid)); }
            if(meusFavoritos.vod.length > 0) { grid.innerHTML += `<div style="grid-column: 1 / -1; font-size: 18px; color: #fff; margin-top: 20px;">Filmes</div>`; meusFavoritos.vod.forEach(i => criarCardFavorito(i, grid)); }
            if(meusFavoritos.series.length > 0) { grid.innerHTML += `<div style="grid-column: 1 / -1; font-size: 18px; color: #fff; margin-top: 20px;">Séries</div>`; meusFavoritos.series.forEach(i => criarCardFavorito(i, grid)); }
            if(grid.innerHTML === '') grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #aaa;">Sem favoritos salvos.</div>';
        }
        function criarCardFavorito(item, grid) {
            const card = document.createElement('div'); card.className = 'card-item';
            const imgUrl = getSafeImage(item.stream_icon);
            card.innerHTML = `<img src="${imgUrl}" class="card-img" onerror="this.onerror=null; this.src='${imgFallback}';"><div class="card-title">${item.nome}</div>`;
            card.onclick = () => interceptarAbrirDetalhes(item, item.nome);
            grid.appendChild(card);
        }

        // --- VÍDEO ---
        const player = document.getElementById('player');
        
        player.onerror = () => { document.getElementById('video-error').style.display = 'block'; };

        player.ontimeupdate = () => {
            if (tipoAtual !== 'live' && player.currentTime > 5 && player.duration > 0) {
                if (player.currentTime < player.duration - 15) localStorage.setItem('iptv_time_' + videoIdAtual, player.currentTime);
                else localStorage.removeItem('iptv_time_' + videoIdAtual);
            }
        };

        function forcarAbaExterna() { window.open(urlVideoAtual, '_blank'); }
        function baixarVideo() { window.open(urlVideoAtual, '_blank'); }

        function prepararVideo(id, ext, nome) {
            videoIdAtual = id; nomeVideoAtual = nome;
            if(tipoAtual === 'live') urlVideoAtual = `${credenciais.url}/live/${credenciais.user}/${credenciais.pass}/${id}.m3u8`;
            else if(tipoAtual === 'series') urlVideoAtual = `${credenciais.url}/series/${credenciais.user}/${credenciais.pass}/${id}.${ext || 'mp4'}`;
            else urlVideoAtual = `${credenciais.url}/movie/${credenciais.user}/${credenciais.pass}/${id}.${ext || 'mp4'}`;
            
            if (tipoAtual !== 'live') {
                let savedTime = localStorage.getItem('iptv_time_' + videoIdAtual);
                if (savedTime && parseFloat(savedTime) > 5) {
                    let st = parseFloat(savedTime);
                    let min = Math.floor(st / 60); let sec = Math.floor(st % 60);
                    document.getElementById('resume-time').innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
                    document.getElementById('resume-modal').style.display = 'flex';
                    
                    document.getElementById('btn-resume-continue').onclick = () => {
                        document.getElementById('resume-modal').style.display = 'none';
                        iniciarVideoHLS(st);
                    };
                    return;
                }
            }
            iniciarVideoHLS(0);
        }

        function iniciarVideoHLS(startTime) {
            document.getElementById('resume-modal').style.display = 'none';
            document.getElementById('video-modal').style.display = 'flex';
            document.getElementById('video-title').innerText = nomeVideoAtual;
            document.getElementById('video-error').style.display = 'none';
            
            document.getElementById('btn-download').style.display = (tipoAtual === 'live' || urlVideoAtual.includes('.m3u8')) ? 'none' : 'flex';

            if (hlsInfo) { hlsInfo.destroy(); hlsInfo = null; }

            if (player.canPlayType('application/vnd.apple.mpegurl') || !urlVideoAtual.includes('.m3u8')) {
                player.src = urlVideoAtual;
                player.onloadedmetadata = () => { 
                    if(startTime > 0) player.currentTime = startTime; 
                    player.play().catch(e => { document.getElementById('video-error').style.display = 'block'; }); 
                };
            } else if (Hls.isSupported() && urlVideoAtual.includes('.m3u8')) {
                hlsInfo = new Hls(); 
                hlsInfo.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) document.getElementById('video-error').style.display = 'block';
                });
                hlsInfo.loadSource(urlVideoAtual); 
                hlsInfo.attachMedia(player);
                hlsInfo.on(Hls.Events.MANIFEST_PARSED, () => {
                    if(startTime > 0) player.currentTime = startTime;
                    player.play().catch(e => console.log(e));
                });
            }
        }

        function fecharPlayer() {
            document.getElementById('video-modal').style.display = 'none';
            player.pause(); player.src = '';
            if (hlsInfo) { hlsInfo.destroy(); hlsInfo = null; }
        }
    </script>
</body>
</html>
